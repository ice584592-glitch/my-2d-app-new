<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar 2D & 3D Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-blue-900 to-blue-950 text-white min-h-screen pb-20">

    <!-- Top Header -->
    <header class="flex justify-between items-center p-4">
        <h1 class="text-lg font-bold tracking-wide">Myanmar 2D</h1>
        <div class="flex items-center gap-2">
            <span class="bg-red-500/20 text-red-400 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1 border border-red-500/30">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> LIVE
            </span>
            <button class="text-slate-300 hover:text-white p-1"><i class="fa-solid fa-gear text-lg"></i></button>
        </div>
    </header>

    <!-- Main Live 2D Number Display -->
    <main class="px-4 max-w-md mx-auto space-y-4">
        
        <div class="text-center py-2">
            <div id="live-twod" class="text-7xl font-black tracking-widest text-white drop-shadow-lg">48</div>
            <p class="text-xs text-blue-200 mt-2 flex items-center justify-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span> Updated <span id="update-time">2026-11-10 02:42:23 PM</span>
            </p>
        </div>

        <!-- Morning Session Card -->
        <div class="bg-blue-900/60 border border-blue-700/50 rounded-2xl p-4 shadow-xl backdrop-blur-md">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-semibold flex items-center gap-2 text-blue-100">
                    <i class="fa-solid fa-sun text-yellow-400"></i> 12:01 PM
                </span>
                <span class="bg-amber-400 text-slate-950 text-[10px] font-extrabold px-2.5 py-0.5 rounded-md tracking-wider">MORNING</span>
            </div>
            <div class="flex justify-between items-end">
                <div>
                    <div class="text-[10px] text-blue-300 tracking-wider">SET</div>
                    <div id="morning-set" class="text-lg font-bold text-white">1,494.41</div>
                </div>
                <div>
                    <div class="text-[10px] text-blue-300 tracking-wider">VALUE</div>
                    <div id="morning-value" class="text-lg font-bold text-white">40,497.76</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-blue-300">2D</div>
                    <div id="morning-twod" class="text-3xl font-black text-amber-400">17</div>
                </div>
            </div>
        </div>

        <!-- Evening Session Card -->
        <div class="bg-blue-900/60 border border-blue-700/50 rounded-2xl p-4 shadow-xl backdrop-blur-md">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-semibold flex items-center gap-2 text-blue-100">
                    <i class="fa-solid fa-moon text-amber-300"></i> 4:30 PM
                </span>
                <span class="bg-amber-400 text-slate-950 text-[10px] font-extrabold px-2.5 py-0.5 rounded-md tracking-wider">EVENING</span>
            </div>
            <div class="flex justify-between items-end">
                <div>
                    <div class="text-[10px] text-blue-300 tracking-wider">SET</div>
                    <div id="evening-set" class="text-lg font-bold text-white">1,496.74</div>
                </div>
                <div>
                    <div class="text-[10px] text-blue-300 tracking-wider">VALUE</div>
                    <div id="evening-value" class="text-lg font-bold text-white">53,258.99</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-blue-300">2D</div>
                    <div id="evening-twod" class="text-3xl font-black text-amber-400">--</div>
                </div>
            </div>
        </div>

        <!-- 9:30 AM & 2:00 PM Grid Cards -->
        <div class="grid grid-cols-2 gap-3">
            <!-- 9:30 AM -->
            <div class="bg-blue-900/60 border border-blue-700/50 rounded-2xl p-4 shadow-xl">
                <div class="text-xs font-semibold text-blue-100 mb-2">9:30 AM</div>
                <div class="flex justify-between items-center text-center">
                    <div>
                        <div class="text-[9px] text-blue-300">MODERN</div>
                        <div class="text-xl font-bold text-white">84</div>
                    </div>
                    <div class="h-8 w-[1px] bg-blue-700/50"></div>
                    <div>
                        <div class="text-[9px] text-blue-300">INTERNET</div>
                        <div class="text-xl font-bold text-white">51</div>
                    </div>
                </div>
            </div>

            <!-- 2:00 PM -->
            <div class="bg-blue-900/60 border border-blue-700/50 rounded-2xl p-4 shadow-xl">
                <div class="text-xs font-semibold text-blue-100 mb-2">2:00 PM</div>
                <div class="flex justify-between items-center text-center">
                    <div>
                        <div class="text-[9px] text-blue-300">MODERN</div>
                        <div class="text-xl font-bold text-white">02</div>
                    </div>
                    <div class="h-8 w-[1px] bg-blue-700/50"></div>
                    <div>
                        <div class="text-[9px] text-blue-300">INTERNET</div>
                        <div class="text-xl font-bold text-white">28</div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar (ပုံစံတူ Tab များ) -->
    <nav class="fixed bottom-3 left-4 right-4 bg-blue-950/90 border border-blue-800/60 backdrop-blur-lg rounded-2xl py-2 px-4 flex justify-around items-center shadow-2xl max-w-md mx-auto">
        <button onclick="switchTab('live')" id="nav-live" class="flex flex-col items-center text-amber-400 text-xs py-1 px-4 rounded-xl bg-amber-400/20 transition">
            <i class="fa-solid fa-house text-base mb-0.5"></i>
            <span class="text-[10px] font-semibold">Live</span>
        </button>
        <button onclick="switchTab('twod')" id="nav-twod" class="flex flex-col items-center text-slate-400 text-xs py-1 px-4 rounded-xl hover:text-white transition">
            <i class="fa-solid fa-chart-line text-base mb-0.5"></i>
            <span class="text-[10px] font-semibold">2D</span>
        </button>
        <button onclick="switchTab('threed')" id="nav-threed" class="flex flex-col items-center text-slate-400 text-xs py-1 px-4 rounded-xl hover:text-white transition">
            <i class="fa-solid fa-cubes text-base mb-0.5"></i>
            <span class="text-[10px] font-semibold">3D</span>
        </button>
        <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center text-slate-400 text-xs py-1 px-4 rounded-xl hover:text-white transition">
            <i class="fa-solid fa-chart-simple text-base mb-0.5"></i>
            <span class="text-[10px] font-semibold">History</span>
        </button>
        <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center text-slate-400 text-xs py-1 px-4 rounded-xl hover:text-white transition">
            <i class="fa-regular fa-calendar text-base mb-0.5"></i>
            <span class="text-[10px] font-semibold">Calendar</span>
        </button>
    </nav>

    <script>
        function switchTab(tab) {
            // တက်ဘ်ပြောင်းလဲမှုများအတွက် လိုအပ်ပါက ဤနေရာတွင် ကုဒ်ထပ်ထည့်နိုင်ပါသည်
        }
    </script>
</body>
</html>
